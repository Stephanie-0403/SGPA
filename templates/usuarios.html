{% extends "layout.html" %}

{% block content %}
<div class="card">
    <h2>GESTIÓN DE USUARIOS</h2>
    
    <div class="grid-2">
        <div>
            <form action="#" method="POST">
                <div class="form-group">
                    <label>ID Usuario (Automático)</label>
                    <input type="text" disabled value="AUTOGEN-001">
                </div>
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="nombre" placeholder="Nombre Completo">
                </div>
                <div class="form-group">
                    <label>Número de Identificación</label>
                    <input type="text" name="identificacion" placeholder="ID">
                </div>
                <div class="form-group">
                    <label>Grupo</label>
                    <select name="grupo">
                        <option value="estudiantes">Estudiantes</option>
                        <option value="profesores">Profesores</option>
                        <option value="administrativos">Administrativos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha de Registro (Automática)</label>
                    <input type="text" disabled value="{{ fecha_actual }}">
                </div>
                
                <div class="btn-group">
                    <button type="button" class="btn">Registrar</button>
                    <button type="button" class="btn btn-secondary">Modificar</button>
                    <button type="button" class="btn btn-danger">Eliminar</button>
                    <button type="button" class="btn btn-secondary">Buscar</button>
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                </div>
            </form>
        </div>
        
        <div>
            <h3 style="margin-top: 0;">Lista de Usuarios</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Identificación</th>
                        <th>Grupo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Juan Pérez</td>
                        <td>12345678</td>
                        <td>Estudiantes</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
