{% extends "layout.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>PRÉSTAMOS</h2>
    
    <form action="#" method="POST">
        <div class="form-group">
            <label>Usuario</label>
            <select name="usuario">
                <option value="">Seleccione un usuario...</option>
                <option value="1">Juan Pérez</option>
            </select>
        </div>
        <div class="form-group">
            <label>Material</label>
            <select name="material">
                <option value="">Seleccione un material...</option>
                <option value="1">Libro de Matemáticas</option>
            </select>
        </div>
        <div class="form-group">
            <label>Fecha de Préstamo (Automática)</label>
            <input type="text" disabled value="{{ fecha_actual }}">
        </div>
        <div class="form-group">
            <label>Fecha de Devolución</label>
            <input type="date" name="fecha_devolucion">
        </div>
        
        <div class="btn-group">
            <button type="button" class="btn">Registrar préstamo</button>
            <button type="reset" class="btn btn-secondary">Cancelar</button>
        </div>
    </form>
</div>
{% endblock %}
