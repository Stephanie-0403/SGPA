<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA - Sistema de Préstamos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% if request.endpoint != 'login' %}
    <nav class="navbar">
        <a href="{{ url_for('menu') }}" class="navbar-brand">SGPA - Equipo Maracuyá</a>
        <div>
            <a href="{{ url_for('login') }}" class="btn btn-secondary">Cerrar Sesión</a>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
